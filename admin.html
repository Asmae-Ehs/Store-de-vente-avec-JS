<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - EdelGlow</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="stylesadmin.css">
    
</head>
<body>
    <!-- Section Authentification -->
    <div id="auth-section" class="auth-container">
        <div class="auth-box">
            <h2><i class="fas fa-lock"></i> Connexion Admin</h2>
            <form id="loginForm">
                <div class="form-group">
                    <input type="password" id="adminPassword" class="form-control" placeholder="Mot de passe" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Se connecter
                </button>
                <p id="errorMsg" style="color: rgb(184, 126, 126); margin-top: 1rem;"></p>
            </form>
        </div>
    </div>

    <!-- Interface Admin -->
    <div id="admin-section">
        <header class="admin-header">
            <h1><i class="fas fa-cog"></i> Tableau de Bord EdelGlow</h1>
            <button id="logoutBtn" class="btn btn-danger">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </button>
        </header>

        <main style="padding: 0 2rem;">
            <section class="product-form">
                <h2><i class="fas fa-plus-circle"></i> Ajouter un Produit</h2>
                <form id="productForm">
                    <div class="form-group">
                        <label>Nom du produit</label>
                        <input type="text" id="productName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Prix (DH)</label>
                        <input type="number" id="productPrice" class="form-control" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Catégorie</label>
                        <select id="productCategory" class="form-control" required>
                            <option value="">-- Sélectionnez --</option>
                            <option value="bagues">Bagues</option>
                            <option value="colliers">Colliers</option>
                            <option value="bracelets">Bracelets</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Image (URL)</label>
                        <input type="text" id="productImage" class="form-control" placeholder="images/nom-image.jpg">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="productDescription" class="form-control" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Enregistrer
                    </button>
                </form>
            </section>

            <section>
                <h2><i class="fas fa-list"></i> Liste des Produits</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Nom</th>
                                <th>Prix</th>
                                <th>Catégorie</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productTable">
                            
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="admin.js"></script>
    
</body>
</html>
